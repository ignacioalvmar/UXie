<!doctype html>
<!-- Static reference exported from the UXie Login design canvas. Visual reference only: implement with Tailwind + shadcn/ui per HANDOFF.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>UXie sign in, mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;display=swap">
<style>
body{margin:0}
a{color:#5135C9}a:hover{color:#3A2399}
input::placeholder{color:#6E6887}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #5135C9;outline-offset:2px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F6F4FB; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1F1A33; display: flex; flex-direction: column">
  <header style="height: 272px; flex-shrink: 0; background: #ECE7FA; border-radius: 0 0 32px 32px; padding: 28px 24px 0 24px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 32px; height: 32px; border-radius: 10px; background: #5135C9; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M10 9.2a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2"></path></svg></span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em">UXie</span>
    </div>
    <p style="align-self: flex-end; margin: -8px 0 0 0; background: #FFFFFF; border-radius: 16px 16px 6px 16px; padding: 8px 12px; font-size: 15px; line-height: 1.35">Ready for another good question?</p>
    <div style="display: flex; align-items: flex-end; justify-content: center; height: 172px">
      <img src="../assets/pip.png" alt="" style="height: 150px; width: auto">
      <img src="../assets/miso.png" alt="" style="height: 164px; width: auto; margin-left: -14px">
      <img src="../assets/luma.png" alt="" style="height: 150px; width: auto; margin-left: -14px">
    </div>
  </header>
  <form action="#" style="padding: 24px 24px 0 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em">Sign in</h1>
      <p style="margin: 0; font-size: 16px; color: #4A4563">Pick up your papers where you left them.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="am-email" style="font-weight: 700; font-size: 15px">University email</label>
      <input id="am-email" type="email" autocomplete="username" placeholder="name@thi.de" style="height: 50px; padding: 0 14px; border: 1.5px solid #857F9F; border-radius: 12px; font: inherit; font-size: 17px; color: #1F1A33; background: #FFFFFF">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="am-pass" style="font-weight: 700; font-size: 15px">Password</label>
      <div style="position: relative">
        <input id="am-pass" type="password" autocomplete="current-password" style="width: 100%; box-sizing: border-box; height: 50px; padding: 0 54px 0 14px; border: 1.5px solid #857F9F; border-radius: 12px; font: inherit; font-size: 17px; color: #1F1A33; background: #FFFFFF">
        <button type="button" aria-label="Show password" style="position: absolute; right: 3px; top: 3px; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #4A4563; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <a href="reset-password-mobile.html" style="align-self: flex-end; font-size: 15px; font-weight: 700; padding: 10px 0">Forgot password?</a>
    </div>
    <button type="submit" style="height: 54px; border: 0; border-radius: 12px; background: #5135C9; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 18px">Sign in</button>
    <p style="margin: 0; font-size: 16px; text-align: center; color: #4A4563">New to UXie? <a href="sign-up-mobile.html" style="font-weight: 700">Create an account</a></p>
    <p style="margin: 0; font-size: 13px; text-align: center; color: #575270">Data hosted in the EU · <a href="#privacy">Privacy notice</a></p>
  </form>
</div>
</body>
</html>
