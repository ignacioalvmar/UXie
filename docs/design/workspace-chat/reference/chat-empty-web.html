<!doctype html>
<!-- Static reference exported from the "UXie Chat Workspace" design canvas (Empty.dc.html). Visual reference only: implement with Tailwind + shadcn/ui per HANDOFF.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>UXie chat, empty conversation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;display=swap">
<style>
body{margin:0}
a{color:#5135C9}a:hover{color:#3A2399}
textarea::placeholder{color:#6E6887}
textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #5135C9;outline-offset:2px}
.uxie-bob{animation:uxie-bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes uxie-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){.uxie-bob{animation:none}}
.starter:hover{border-color:#5135C9 !important;background:#F6F4FB !important}
</style>
</head>
<body>
<section aria-label="Conversation with Miso" style="width: 620px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border-left: 1.5px solid #E2DCF0; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1F1A33">

<div style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1.5px solid #E2DCF0">
<div role="group" aria-label="Focus mode" style="display: flex; gap: 6px; flex-wrap: wrap">
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 16px; border: 1.5px solid #5135C9; border-radius: 999px; background: #5135C9; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 15px">Understand</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border: 1.5px solid #C9C0E8; border-radius: 999px; background: #FFFFFF; color: #3A2399; font: inherit; font-weight: 700; font-size: 15px">Apply to UX</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border: 1.5px solid #C9C0E8; border-radius: 999px; background: #FFFFFF; color: #3A2399; font: inherit; font-weight: 700; font-size: 15px">Critique</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border: 1.5px solid #C9C0E8; border-radius: 999px; background: #FFFFFF; color: #3A2399; font: inherit; font-weight: 700; font-size: 15px">Build</button>
</div>
<button type="button" aria-haspopup="dialog" style="display: inline-flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 44px; padding: 6px 12px; border: 0; border-radius: 12px; background: #F6F4FB; color: #1F1A33; font: inherit">
<span aria-hidden="true" style="display: flex; gap: 3px">
<span style="width: 22px; height: 6px; border-radius: 3px; background: #E2DCF0"></span>
<span style="width: 22px; height: 6px; border-radius: 3px; background: #E2DCF0"></span>
<span style="width: 22px; height: 6px; border-radius: 3px; background: #E2DCF0"></span>
<span style="width: 22px; height: 6px; border-radius: 3px; background: #E2DCF0"></span>
</span>
<span style="font-size: 14px; font-weight: 700">Progress: 4 ideas to explore</span>
</button>
</div>

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 40px 32px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: flex-end; gap: 14px">
<img alt="" class="uxie-bob" src="../assets/miso.png" style="width: 104px; height: auto; flex: 0 0 auto">
<div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 10px">
<p style="margin: 0; font-size: 14px; font-weight: 700; color: #4A4563">Miso</p>
<p style="margin: 0; background: #FFFFFF; border: 1.5px solid #E2DCF0; border-radius: 18px 18px 18px 6px; padding: 14px 18px; font-size: 18px; line-height: 1.45; text-wrap: pretty">Hi! I’ll ask the questions, you do the thinking. Pick one below to start, or ask me anything about this paper.</p>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2">Start with a question</h2>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<li style="display: flex"><button type="button" class="starter" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 60px; padding: 12px 16px 12px 18px; border: 1.5px solid #C9C0E8; border-radius: 16px; background: #FFFFFF; color: #1F1A33; font: inherit; font-size: 17px; line-height: 1.4; text-align: left; cursor: pointer">What is the difference between a feature being possible and a feature being visible?<svg aria-hidden="true" fill="none" height="20" stroke="#5135C9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="flex: 0 0 auto" viewBox="0 0 24 24" width="20"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></li>
<li style="display: flex"><button type="button" class="starter" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 60px; padding: 12px 16px 12px 18px; border: 1.5px solid #C9C0E8; border-radius: 16px; background: #FFFFFF; color: #1F1A33; font: inherit; font-size: 17px; line-height: 1.4; text-align: left; cursor: pointer">Why do you think so few people found the swipe gesture?<svg aria-hidden="true" fill="none" height="20" stroke="#5135C9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="flex: 0 0 auto" viewBox="0 0 24 24" width="20"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></li>
<li style="display: flex"><button type="button" class="starter" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 60px; padding: 12px 16px 12px 18px; border: 1.5px solid #C9C0E8; border-radius: 16px; background: #FFFFFF; color: #1F1A33; font: inherit; font-size: 17px; line-height: 1.4; text-align: left; cursor: pointer">Have you ever owned an app that could do something you never noticed?<svg aria-hidden="true" fill="none" height="20" stroke="#5135C9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="flex: 0 0 auto" viewBox="0 0 24 24" width="20"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></li>
</ul>
</div>

<div style="flex: 1 1 auto"></div>
<p style="margin: 0; display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 1.45; color: #4A4563"><svg aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="flex: 0 0 auto; margin-top: 1px" viewBox="0 0 24 24" width="20"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"></path><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"></path></svg>Just want to read first? Go ahead. Nothing is saved as a conversation until you send a message or pick a question.</p>
</div>

<form style="flex: 0 0 auto; border-top: 1.5px solid #E2DCF0; padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 10px; margin: 0">
<label for="first-q" style="font-size: 15px; font-weight: 700">Or ask your own question</label>
<div style="display: flex; align-items: flex-end; gap: 10px">
<textarea id="first-q" placeholder="For example: what does “signifier” mean here?" rows="2" style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; min-height: 56px; padding: 14px 16px; border: 1.5px solid #857F9F; border-radius: 12px; font: inherit; font-size: 17px; line-height: 1.4; color: #1F1A33; background: #FFFFFF; resize: none"></textarea>
<button type="submit" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 56px; padding: 0 20px; border: 0; border-radius: 12px; background: #5135C9; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 17px">Send<svg aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="20"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</form>
</section>
</body>
</html>
