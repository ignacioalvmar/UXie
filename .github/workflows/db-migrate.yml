name: DB migrate

# PRD §17.1: migrations are applied to the hosted Supabase project BEFORE the PR that needs them is
# merged, so Vercel and Render (both deploying from main) always see a compatible schema.
# Migrations must stay backward-compatible for one release. Run from the Actions tab.
#
# Setup (docs/runbook.md → "Production setup"): GitHub environments `dev` and `production`
# (production with required reviewers), each with the secrets SUPABASE_ACCESS_TOKEN,
# SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target project
        type: choice
        options: [dev, production]
        default: dev
      dry_run:
        description: Only list the migrations that would be applied
        type: boolean
        default: true

concurrency:
  group: db-migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Pending migrations
        run: pnpm exec supabase migration list
      - name: Apply (never seeds)
        if: ${{ !inputs.dry_run }}
        run: pnpm exec supabase db push
