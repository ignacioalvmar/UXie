<!doctype html>
<!-- Static reference exported from the UXie Login design canvas. Visual reference only: implement with Tailwind + shadcn/ui per HANDOFF.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>UXie reset password, mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;display=swap">
<style>
body{margin:0}
a{color:#5135C9}a:hover{color:#3A2399}
input::placeholder{color:#6E6887}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #5135C9;outline-offset:2px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F6F4FB; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1F1A33; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 16px 0 8px">
    <a href="sign-in-mobile.html" aria-label="Back to sign in" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1F1A33; border-radius: 10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">UXie</span>
  </header>
  <div style="padding: 24px 24px 0 24px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: flex-end; gap: 10px">
      <img src="../assets/pip.png" alt="" style="height: 120px; width: auto; flex-shrink: 0">
      <div style="background: #FFFFFF; border: 1.5px solid #E2DCF0; border-radius: 20px 20px 20px 6px; padding: 12px 16px; font-size: 16px; line-height: 1.4; margin-bottom: 14px">Happens to everyone. Want a fresh one?</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em">Reset your password</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4A4563">Enter your university email and we'll send you a link to set a new password.</p>
    </div>
    <form action="#" style="display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="rs-email" style="font-weight: 700; font-size: 15px">University email</label>
        <input id="rs-email" type="email" autocomplete="username" placeholder="name@thi.de" style="height: 50px; padding: 0 14px; border: 1.5px solid #857F9F; border-radius: 12px; font: inherit; font-size: 17px; color: #1F1A33; background: #FFFFFF">
      </div>
      <button type="submit" style="height: 54px; border: 0; border-radius: 12px; background: #5135C9; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 18px">Send reset link</button>
      <a href="sign-in-mobile.html" style="align-self: center; font-size: 16px; font-weight: 700; padding: 10px 8px">Back to sign in</a>
    </form>
  </div>
</div>
</body>
</html>
