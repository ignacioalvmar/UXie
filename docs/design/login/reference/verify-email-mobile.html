<!doctype html>
<!-- Static reference exported from the UXie Login design canvas. Visual reference only: implement with Tailwind + shadcn/ui per HANDOFF.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>UXie check your inbox, mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;display=swap">
<style>
body{margin:0}
a{color:#5135C9}a:hover{color:#3A2399}
button:focus-visible,a:focus-visible{outline:3px solid #5135C9;outline-offset:2px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F6F4FB; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1F1A33; display: flex; flex-direction: column; align-items: center; padding: 0 28px; box-sizing: border-box">
  <header style="align-self: stretch; display: flex; align-items: center; gap: 8px; padding-top: 28px">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em">UXie</span>
  </header>
  <div style="margin-top: 56px; width: 240px; height: 240px; border-radius: 120px; background: #E4F1DA; display: flex; align-items: flex-end; justify-content: center; overflow: hidden">
    <img src="../assets/miso.png" alt="Miso, waiting with a satchel" style="height: 224px; width: auto">
  </div>
  <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 10px; text-align: center">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em">Check your inbox</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #4A4563">We sent a confirmation link to <strong style="color: #1F1A33">l.meyer@thi.de</strong>. Open it on any device to finish setting up.</p>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #575270">It can take a minute. Check your spam folder too.</p>
  </div>
  <div style="margin-top: auto; margin-bottom: 32px; align-self: stretch; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="height: 54px; border: 2px solid #5135C9; border-radius: 12px; background: #FFFFFF; color: #5135C9; font: inherit; font-weight: 700; font-size: 18px">Resend email</button>
    <a href="sign-up-mobile.html" style="align-self: center; font-size: 16px; font-weight: 700; padding: 12px 8px">Use a different email</a>
  </div>
</div>
</body>
</html>
