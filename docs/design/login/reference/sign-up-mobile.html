<!doctype html>
<!-- Static reference exported from the UXie Login design canvas. Visual reference only: implement with Tailwind + shadcn/ui per HANDOFF.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>UXie create account, mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;display=swap">
<style>
body{margin:0}
a{color:#5135C9}a:hover{color:#3A2399}
input::placeholder{color:#6E6887}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #5135C9;outline-offset:2px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F6F4FB; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1F1A33; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 16px 0 8px">
    <a href="sign-in-mobile.html" aria-label="Back to sign in" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1F1A33; border-radius: 10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">UXie</span>
  </header>
  <form action="#" style="padding: 12px 24px 0 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em">Create your account</h1>
      <p style="margin: 0; font-size: 16px; color: #4A4563">For students enrolled in the course.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-email" style="font-weight: 700; font-size: 15px">University email</label>
      <input id="su-email" type="email" autocomplete="email" placeholder="name@thi.de" aria-describedby="su-email-hint" style="height: 50px; padding: 0 14px; border: 1.5px solid #857F9F; border-radius: 12px; font: inherit; font-size: 17px; color: #1F1A33; background: #FFFFFF">
      <p id="su-email-hint" style="margin: 0; font-size: 14px; color: #575270">Only university addresses can register.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-pass" style="font-weight: 700; font-size: 15px">Create a password</label>
      <input id="su-pass" type="password" autocomplete="new-password" aria-describedby="su-pass-hint" style="height: 50px; padding: 0 14px; border: 1.5px solid #857F9F; border-radius: 12px; font: inherit; font-size: 17px; color: #1F1A33; background: #FFFFFF">
      <p id="su-pass-hint" style="margin: 0; font-size: 14px; color: #575270; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>At least 10 characters</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-code" style="font-weight: 700; font-size: 15px">Course invite code <span style="font-weight: 400; color: #575270">(if your instructor gave you one)</span></label>
      <input id="su-code" type="text" autocomplete="off" style="height: 50px; padding: 0 14px; border: 1.5px solid #857F9F; border-radius: 12px; font: inherit; font-size: 17px; color: #1F1A33; background: #FFFFFF">
    </div>
    <button type="submit" style="height: 54px; border: 0; border-radius: 12px; background: #5135C9; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 18px; margin-top: 4px">Create account</button>
    <div style="display: flex; align-items: center; gap: 12px; background: #ECE7FA; border-radius: 16px; padding: 10px 14px">
      <div style="display: flex; flex-shrink: 0">
        <img src="../assets/pip.png" alt="" style="height: 44px; width: auto">
        <img src="../assets/miso.png" alt="" style="height: 44px; width: auto; margin-left: -10px">
        <img src="../assets/luma.png" alt="" style="height: 44px; width: auto; margin-left: -10px">
      </div>
      <p style="margin: 0; font-size: 15px; line-height: 1.35">Next: confirm your email, then choose your UXie.</p>
    </div>
  </form>
</div>
</body>
</html>
